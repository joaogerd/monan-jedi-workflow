# Campanha: copie este diretório inteiro, não este arquivo isoladamente.
#
# Comece com P3D. Depois de validar o experimento, crie um novo destination e
# altere somente duration para P7D, P30D ou P365D.
campaign:
  name: EDITAR-nome-do-experimento
  start: EDITAR-AAAA-MM-DDT00:00:00Z
  duration: P3D
  cycle_interval_hours: 6
  destination: EDITAR-cases/nome-do-experimento

# O profile liga esta campanha aos arquivos científicos. O caminho é relativo a
# este campaign.yaml.
profile: profile.yaml

# true: roda MONAN/MPAS também depois da última análise.
# false: termina na última análise.
forecast:
  run_on_last_cycle: true

# Normalmente não precisa ser alterado.
execution:
  swf_command: swf
