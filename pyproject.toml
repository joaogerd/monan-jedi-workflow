[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monan-jedi-workflow"
version = "0.3.0b1"
description = "Python-first workflow for reproducible MONAN MPAS-JEDI experiments."
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "numpy>=1.24",
  "netCDF4>=1.6",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
orchestration = ["simpleworkflow>=0.6.2"]
dev = [
  "pytest>=8.0",
]

[project.scripts]
obs = "monan_jedi_workflow.platform_cli:obs"
jedi = "monan_jedi_workflow.platform_cli:jedi"
mpas = "monan_jedi_workflow.platform_cli:mpas"
diagnostics = "monan_jedi_workflow.platform_cli:diagnostics"
campaign = "monan_jedi_workflow.platform_cli:campaign"
monan-jedi-workflow = "monan_jedi_workflow.cli_frontend:main"
monan-jedi-mpas = "monan_jedi_workflow.cli_mpas:main"

[tool.setuptools.packages.find]
include = ["monan_jedi_workflow*"]
exclude = ["configs*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.setuptools.package-data]
monan_jedi_workflow = ["catalog/**/*.yaml", "catalog/**/*.py", "catalog/**/*.md"]
