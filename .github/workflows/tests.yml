name: Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  pytest:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: make install

      - name: Run tests
        run: python -m pytest --junitxml=pytest-results.xml

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.python-version }}
          path: pytest-results.xml
          if-no-files-found: error

      - name: Check safe workflow targets
        env:
          MONAN_JEDI_INSTALL_ROOT: ${{ runner.temp }}/monan-jedi
          STACK_ROOT: ${{ runner.temp }}/spack-stack
        run: |
          mkdir -p "$MONAN_JEDI_INSTALL_ROOT/share/monan-jedi"
          mkdir -p "$STACK_ROOT"
          cat > "$MONAN_JEDI_INSTALL_ROOT/share/monan-jedi/install-manifest.json" <<'JSON'
          {
            "ecosystem_contract_version": 2,
            "contract": "monan-jedi-runtime-v2",
            "public_anchors": ["MONAN_JEDI_INSTALL_ROOT", "STACK_ROOT"],
            "stack": {
              "env_name": "jaci-test",
              "env_module": "test/jedi-mpas-env/2.0.0",
              "site_setup": "configs/sites/tier2/jaci/setup.sh",
              "module_root_template": "envs/{env_name}/modules"
            }
          }
          JSON
          make validate
          make render-yaml
          make render-pbs

      - name: Report native-cycle structure
        run: python scripts/report_native_cycle_structure.py
