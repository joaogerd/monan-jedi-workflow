# JEDI 3D-FGAT — x1.10242.
#
# Primeiro E2E 2025: Radiosonde + superfície PREPBUFR + GNSS-RO (M3/3dias).
jedi:
  cycle:
    step_hours: 6
    background_offset_hours: -3
    window_hours: 6

  variables:
    monan_jedi_install_root: ${MONAN_JEDI_INSTALL_ROOT}
    stack_root: ${STACK_ROOT}
    data_root: ${MONAN_JEDI_DATA_ROOT}
    # B compartilhada x1.10242/55 níveis: NICAS, HDIAG e VBAL.
    # Em outro site, ajuste este caminho; não é necessário exportar uma variável.
    bmatrix_root: /p/projetos/monan_das/share/MONAN-JEDI-Data/covariance/x1.10242_240km/55levels
    model_tstep: PT20M

  run_dir: "work/jedi/{cycle_id}"

  background:
    initial_source: "work/background/{cycle_id}/trajectory.nc"
    source: "work/background/{cycle_id}/trajectory.nc"
    target: "background/mpasout.{background_mpas_file_time}.nc"

  analysis_base_state:
    source: "work/background/{cycle_id}/state.nc"
    target: "Data/states/mpas.3dfgat.{analysis_mpas_file_time}.nc"
    template_fields_target: templateFields.10242.nc
    required_variables: [rho, theta, u, qv, surface_pressure, skintemp, refl10cm]

  links:
    - source: "{bmatrix_root}"
      target: Data/covariance
    - source: "work/obs/{analysis_yyyymmddhh}/sondes_obs_{analysis_yyyymmddhh}.h5"
      target: "Data/ufo/testinput_tier_1/sondes_obs_{analysis_yyyymmddhh}_m.nc4"
    - source: "work/obs/{analysis_yyyymmddhh}/sfc_obs_{analysis_yyyymmddhh}.h5"
      target: "Data/ufo/testinput_tier_1/sfc_obs_{analysis_yyyymmddhh}_m.nc4"

    - source: "work/obs/{analysis_yyyymmddhh}/gnssro_obs_{analysis_yyyymmddhh}.h5"
      target: "Data/ufo/testinput_tier_1/gnssro_obs_{analysis_yyyymmddhh}_s.nc4"

  templates:
    - source: templates/variational.yaml
      target: variational.yaml
    - source: templates/namelist.atmosphere.jedi.in
      target: namelist.atmosphere.outer
    - source: templates/namelist.atmosphere.jedi.in
      target: namelist.atmosphere.inner

  nonlinear_trajectory:
    yaml: variational.yaml
    outer_namelist: namelist.atmosphere.outer

  pbs:
    filename: run_jedi.pbs
    job_name: "jedi_{analysis_yyyymmddhh}"
    queue: pesqmini
    select: 1
    ncpus: 64
    mpiprocs: 64
    walltime: "00:30:00"
    launcher: mpiexec
    command:
      - "{monan_jedi_install_root}/bin/mpasjedi_variational.x"
      - variational.yaml
    environment:
      OMP_NUM_THREADS: "1"
      FI_CXI_RX_MATCH_MODE: hybrid

  validation:
    log: jedi.stdout.log
    required_log_markers: ["OOPS Ending"]
    required_outputs:
      - role: analysis
        path: "Data/states/mpas.3dfgat.{analysis_mpas_file_time}.nc"
