name: Tests

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - feat/platform-domain-apps
      - refactor/machine-independent-site-config
      - develop
      - main

jobs:
  pytest:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: make install

      - name: Validate local documentation links
        run: python scripts/check_docs_links.py

      - name: Run tests
        run: python -m pytest --junitxml=pytest-results.xml

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.python-version }}
          path: pytest-results.xml
          if-no-files-found: error

      - name: Verify packaged recipe in built wheel
        run: |
          python -m pip wheel --no-deps -w /tmp/monan-jedi-wheels .
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("/tmp/monan-jedi-wheels").glob("monan_jedi_workflow*.whl"))
          assert len(wheels) == 1, wheels
          with ZipFile(wheels[0]) as wheel:
              paths = set(wheel.namelist())
          required = {
              "monan_jedi_workflow/recipes/mpas-jedi-3dvar/recipe.yaml",
              "monan_jedi_workflow/recipes/mpas-jedi-3dvar/README.md",
              "monan_jedi_workflow/recipes/mpas-jedi-3dvar/science/jedi.yaml",
              "monan_jedi_workflow/recipes/mpas-jedi-3dvar/science/initialization/mpas.yaml",
              "monan_jedi_workflow/recipes/mpas-jedi-3dvar/science/templates/variational.yaml",
          }
          missing = required - paths
          assert not missing, f"Wheel missing scientific resources: {sorted(missing)}"
          print("Packaged recipe and scientific catalog verified")
          PY

      - name: Check public CLI
        run: |
          experiment --help
          diagnose --help
          wps --help
          obs --help
          jedi --help
          mpas --help
          diagnostics --help
          campaign --help
          monan-jedi-workflow --help
          monan-jedi-workflow campaign --help

      - name: Report native-cycle structure
        run: python scripts/report_native_cycle_structure.py
