pbs:
  job_name: 3dfgat_mpastatic_x1_10242
  queue: pesqmini
  select: 1
  ncpus: 64
  mpiprocs: 64
  walltime: "00:30:00"
  project: null

  launcher: /opt/cray/pals/1.6/bin/mpiexec

  # Rebuild the selected scientific environment on the compute node. STACK_ROOT
  # is an ecosystem anchor supplied by the user/site, not a repository path.
  bootstrap:
    - 'module purge'
    - 'pushd "${STACK_ROOT}" >/dev/null'
    - 'source configs/sites/tier2/jaci/setup.sh'
    - 'popd >/dev/null'
    - 'module use "${STACK_ROOT}/envs/jaci-mpas-jedi-gcc12-craympich/modules"'
    - 'module load cray-mpich/8.1.31/none/none/jedi-mpas-env/1.0.0'

  runtime:
    omp_num_threads: 1
    oops_trace: 0
    oops_debug: 0
    gfortran_convert_unit: "big_endian:101-200"
    f_ufmtendian: "big"
    fi_cxi_rx_match_mode: "software"

  log:
    directory: logs
    filename: "run_3dfgat_workflow_geometry_background_np${NP}.${PBS_JOBID}.log"
