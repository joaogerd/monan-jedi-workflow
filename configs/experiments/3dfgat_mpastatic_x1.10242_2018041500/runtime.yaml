runtime:
  # Runtime software/support comes only from the public MONAN-JEDI installation.
  # Experiment/background fields that are scientific inputs remain relative to
  # experiment.paths.data_root.
  required_links:
    - source: background/2018041418/mpasout.2018-04-14_21.00.00.nc
      target: background/mpasout.2018-04-14_21.00.00.nc

    # streams.atmosphere_240km reads the input stream at the analysis time.
    # Keep this template file at 00Z, while the FGAT background state remains 21Z.
    - source: background/2018041418/mpasout.2018-04-15_00.00.00.nc
      target: templateFields.10242.nc

    - source: MPAS_namelist_stream_physics_files/x1.10242.invariant.nc
      target: x1.10242.invariant.nc

    - source: MPAS_namelist_stream_physics_files/x1.10242.graph.info.part.64
      target: x1.10242.graph.info.part.64

    - source: MPAS_namelist_stream_physics_files/namelist.atmosphere_240km
      target: namelist.atmosphere.outer

    - source: MPAS_namelist_stream_physics_files/namelist.atmosphere_240km
      target: namelist.atmosphere.inner

    - source: MPAS_namelist_stream_physics_files/streams.atmosphere_240km
      target: streams.atmosphere.outer

    - source: MPAS_namelist_stream_physics_files/streams.atmosphere_240km
      target: streams.atmosphere.inner

    - source: ${MONAN_JEDI_INSTALL_ROOT}/share/monan-jedi/mpas-jedi/namelists/stream_list.atmosphere.background
      target: stream_list.atmosphere.background

    - source: ${MONAN_JEDI_INSTALL_ROOT}/share/monan-jedi/mpas-jedi/namelists/stream_list.atmosphere.analysis
      target: stream_list.atmosphere.analysis

    - source: ${MONAN_JEDI_INSTALL_ROOT}/share/monan-jedi/mpas-jedi/namelists/stream_list.atmosphere.control
      target: stream_list.atmosphere.control

    - source: ${MONAN_JEDI_INSTALL_ROOT}/share/monan-jedi/mpas-jedi/namelists/stream_list.atmosphere.ensemble
      target: stream_list.atmosphere.ensemble

    - source: ${MONAN_JEDI_INSTALL_ROOT}/share/monan-jedi/mpas-jedi/namelists/geovars.yaml
      target: geovars.yaml

    - source: ${MONAN_JEDI_INSTALL_ROOT}/share/monan-jedi/mpas-jedi/namelists/keptvars.yaml
      target: keptvars.yaml

    - source: ufo/testinput_tier_1
      target: Data/ufo/testinput_tier_1

    - source: ${MONAN_JEDI_INSTALL_ROOT}/share/monan-jedi/mpas-jedi/testinput/obsop_name_map.yaml
      target: testinput/obsop_name_map.yaml

  required_directories:
    - background
    - Data
    - Data/os
    - Data/states
    - Data/ufo
    - testinput

  physics_files:
    root: ${MONAN_JEDI_INSTALL_ROOT}/share/MPAS/core_atmosphere
    files:
      - CAM_ABS_DATA.DBL
      - CAM_AEROPT_DATA.DBL
      - COMPATIBILITY
      - GENPARM.TBL
      - LANDUSE.TBL
      - OZONE_DAT.TBL
      - OZONE_LAT.TBL
      - OZONE_PLEV.TBL
      - RRTMG_LW_DATA
      - RRTMG_LW_DATA.DBL
      - RRTMG_SW_DATA
      - RRTMG_SW_DATA.DBL
      - SOILPARM.TBL
      - VEGPARM.TBL

  stream_background_required_fields:
    - ivgtyp
    - isltyp
    - landmask
    - znt
    - t2m

  required_xtime:
    background/mpasout.2018-04-14_21.00.00.nc: "2018-04-14_21:00:00"
    templateFields.10242.nc: "2018-04-15_00:00:00"
