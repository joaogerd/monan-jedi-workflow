jedi:
  cycle:
    step_hours: 6
    background_offset_hours: -3
    window_hours: 6
    first_cycle: '2025-09-01T00:00:00Z'
  variables:
    monan_jedi_install_root: ${MONAN_JEDI_INSTALL_ROOT}
    stack_root: ${STACK_ROOT}
    data_root: ${MONAN_INPUT_ROOT}
    bmatrix_root: ${MONAN_BMATRIX_ROOT}
    model_tstep: PT20M
    mesh_root: ${MONAN_MESH_ROOT}
    physics_root: ${MONAN_PHYSICS_ROOT}
  background:
    initial_source: '{experiment_root}/work/background/{cycle_id}/trajectory.nc'
    source: '{experiment_root}/work/background/{cycle_id}/trajectory.nc'
    target: Data/background/{analysis_yyyymmddhh}/mpasout.{background_mpas_file_time}.nc
  analysis_base_state:
    source: '{experiment_root}/work/background/{cycle_id}/state.nc'
    target: Data/states/mpas.3dfgat.{analysis_mpas_file_time}.nc
    template_fields_target: templateFields.10242.nc
    required_variables:
    - pressure_base
    - pressure_p
    - qc
    - qg
    - qi
    - qr
    - qs
    - qv
    - rho
    - rho_base
    - skintemp
    - smois
    - surface_pressure
    - theta
    - theta_base
    - tslb
    - u
    - uReconstructMeridional
    - uReconstructZonal
    - w
  links:
  - source: '{bmatrix_root}'
    target: Data/covariance
  - source: work/obs/{analysis_yyyymmddhh}/sondes_obs_{analysis_yyyymmddhh}.h5
    target: Data/ufo/sondes_obs_{analysis_yyyymmddhh}_m.nc4
  - source: work/obs/{analysis_yyyymmddhh}/sfc_obs_{analysis_yyyymmddhh}.h5
    target: Data/ufo/sfc_obs_{analysis_yyyymmddhh}_m.nc4
  - source: work/obs/{analysis_yyyymmddhh}/gnssro_obs_{analysis_yyyymmddhh}.h5
    target: Data/ufo/gnssro_obs_{analysis_yyyymmddhh}_s.nc4
  - source: '{mesh_root}/static/x1.10242.invariant.nc'
    target: x1.10242.invariant.nc
  - source: '{mesh_root}/partitions/x1.10242.graph.info.part.128'
    target: x1.10242.graph.info.part.128
  - source: '{physics_root}/CAM_ABS_DATA.DBL'
    target: CAM_ABS_DATA.DBL
  - source: '{physics_root}/CAM_AEROPT_DATA.DBL'
    target: CAM_AEROPT_DATA.DBL
  - source: '{physics_root}/GENPARM.TBL'
    target: GENPARM.TBL
  - source: '{physics_root}/LANDUSE.TBL'
    target: LANDUSE.TBL
  - source: '{physics_root}/OZONE_DAT.TBL'
    target: OZONE_DAT.TBL
  - source: '{physics_root}/OZONE_LAT.TBL'
    target: OZONE_LAT.TBL
  - source: '{physics_root}/OZONE_PLEV.TBL'
    target: OZONE_PLEV.TBL
  - source: '{physics_root}/RRTMG_LW_DATA'
    target: RRTMG_LW_DATA
  - source: '{physics_root}/RRTMG_LW_DATA.DBL'
    target: RRTMG_LW_DATA.DBL
  - source: '{physics_root}/RRTMG_SW_DATA'
    target: RRTMG_SW_DATA
  - source: '{physics_root}/RRTMG_SW_DATA.DBL'
    target: RRTMG_SW_DATA.DBL
  - source: '{physics_root}/SOILPARM.TBL'
    target: SOILPARM.TBL
  - source: '{physics_root}/VEGPARM.TBL'
    target: VEGPARM.TBL
  templates:
  - source: templates/variational.yaml
    target: variational.yaml
  - source: templates/namelist.atmosphere.outer.in
    target: geometry/{analysis_yyyymmddhh}/namelist.atmosphere.outer
  - source: templates/streams.atmosphere.jedi.outer.in
    target: geometry/{analysis_yyyymmddhh}/streams.atmosphere.outer
  - source: templates/namelist.atmosphere.inner.in
    target: geometry/{analysis_yyyymmddhh}/namelist.atmosphere.inner
  - source: templates/streams.atmosphere.jedi.inner.in
    target: geometry/{analysis_yyyymmddhh}/streams.atmosphere.inner
  nonlinear_trajectory:
    yaml: variational.yaml
    outer_namelist: geometry/{analysis_yyyymmddhh}/namelist.atmosphere.outer
  pbs:
    filename: run_jedi.pbs
    job_name: jedi_{analysis_yyyymmddhh}
    queue: pesqmini
    select: 1
    ncpus: 128
    mpiprocs: 128
    walltime: 00:30:00
    launcher: /opt/cray/pals/1.6/bin/mpiexec
    command:
    - '{monan_jedi_install_root}/bin/mpasjedi_variational.x'
    - variational.yaml
    environment:
      OMP_NUM_THREADS: '1'
      FI_CXI_RX_MATCH_MODE: hybrid
      GFORTRAN_CONVERT_UNIT: big_endian:101-200
  validation:
    log: jedi.stdout.log
    required_log_markers:
    - 'Run: Finishing oops::Variational<MPAS, UFO and IODA observations> with status
      = 0'
    - OOPS Ending
    required_outputs:
    - role: analysis
      path: Data/states/mpas.3dfgat.{analysis_mpas_file_time}.nc
  runtime:
    skeleton: runtime-skeleton
