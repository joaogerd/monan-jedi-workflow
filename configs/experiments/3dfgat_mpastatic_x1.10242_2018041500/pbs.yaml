pbs:
  job_name: 3dfgat_mpastatic_x1_10242
  queue: pesqmini
  select: 1
  ncpus: 64
  mpiprocs: 64
  walltime: "00:30:00"
  project: null

  launcher: mpiexec

  # Submission-time ecosystem anchors are resolved by the renderer and embedded
  # in the PBS script, so qsub environment inheritance is not required.
  environment_anchors:
    monan_jedi_install_root: ${MONAN_JEDI_INSTALL_ROOT}
    stack_root: ${STACK_ROOT}

  # Rebuild the selected scientific environment on the compute node. STACK_ROOT
  # is an ecosystem anchor supplied by the user/site, not a repository path.
  bootstrap:
    - 'module purge'
    - 'monan_had_nounset=0; case "$-" in *u*) monan_had_nounset=1 ;; esac'
    - 'set +u'
    - 'pushd "${STACK_ROOT}" >/dev/null'
    - 'source {stack_site_setup}'
    - 'popd >/dev/null'
    - 'if [[ "${monan_had_nounset}" == "1" ]]; then set -u; else set +u; fi'
    - 'unset monan_had_nounset'
    - 'module use "{stack_module_root}"'
    - 'module load {stack_env_module}'

  runtime:
    omp_num_threads: 1
    oops_trace: 0
    oops_debug: 0
    gfortran_convert_unit: "big_endian:101-200"
    f_ufmtendian: "big"
    # Historical baseline override: this frozen static validation was proven
    # with libfabric software matching. Modern cycling cases use "hybrid".
    # This is job-local runtime policy, not an ecosystem-wide anchor.
    fi_cxi_rx_match_mode: "software"

  log:
    directory: logs
    filename: "run_3dfgat_workflow_geometry_background_np${NP}.${PBS_JOBID}.log"
