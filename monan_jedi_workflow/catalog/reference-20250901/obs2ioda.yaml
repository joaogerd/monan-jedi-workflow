obs2ioda:
  variables:
    monan_jedi_install_root: ${MONAN_JEDI_INSTALL_ROOT}
    data_root: ${MONAN_INPUT_ROOT}
    workflow_root: '{configuration_root}'
    obs2ioda_executable: '{monan_jedi_install_root}/bin/obs2ioda_v3'
    obs2ioda_library_root: '{monan_jedi_install_root}/lib'
    libfabric_library_root: ${MONAN_LIBFABRIC_ROOT}
    prepbufr_runner: '{workflow_root}/scripts/obs2ioda/run_prepbufr.sh'
    gpsro_runner: '{workflow_root}/scripts/obs2ioda/run_gpsro.sh'
    gpsro_input: '{data_root}/observations/gpsro/{cycle_year}/gdas.gpsro.t{cycle_hour}z.{cycle_year}{cycle_month}{cycle_day}.bufr'
    prepbufr_input: '{data_root}/observations/prepnr/{cycle_year}/prepbufr.gdas.{cycle_yyyymmddhh}.nr'
  runtime:
    library_paths:
    - '{obs2ioda_library_root}'
    - '{obs2ioda_library_root}/cxx'
    - '{libfabric_library_root}'
    dependency_checks:
    - '{obs2ioda_executable}'
  inspection:
    argv:
    - ncdump
    - -h
    - '{output}'
    timeout_seconds: 60
    required_header_markers:
    - MetaData
    - ObsValue
    - ObsError
    - PreQC
  provenance:
    sha256: true
  converters:
  - name: prepbufr-conventional
    inputs:
    - '{prepbufr_input}'
    - '{prepbufr_runner}'
    outputs:
    - '{work_dir}/sondes_obs_{cycle_yyyymmddhh}.h5'
    - '{work_dir}/sfc_obs_{cycle_yyyymmddhh}.h5'
    timeout_seconds: 1800
    argv:
    - bash
    - '{prepbufr_runner}'
    - --executable
    - '{obs2ioda_executable}'
    - --input
    - '{prepbufr_input}'
  - name: gpsro-gnssro
    validation:
      required_header_markers:
      - MetaData
      - ObsValue
      - ObsError
    inputs:
    - '{gpsro_input}'
    - '{gpsro_runner}'
    outputs:
    - '{work_dir}/gnssro_obs_{cycle_yyyymmddhh}.h5'
    timeout_seconds: 1800
    argv:
    - bash
    - '{gpsro_runner}'
    - --executable
    - '{obs2ioda_executable}'
    - --input
    - '{gpsro_input}'
