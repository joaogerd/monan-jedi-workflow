# O layout padrão mantém toda a configuração científica neste diretório.
profile:
  cycling_jedi_case: .
  initial_mpas_case: initialization
  mpas_case: .
  obs2ioda_config: obs2ioda.yaml

  # Reutilize arquivos locais; baixe os ausentes dos providers abaixo.
  # As datas são calculadas por ciclo: não edite URLs para P30D.
  observation_acquisition:
    enabled: true
    search_roots:
      - /p/projetos/monan_das/${USER}/data/obs/gdas
      - /oper/dados/bdados/assimila/gdas
    providers:
      prepbufr-conventional:
        type: https
        url: "https://data.gdex.ucar.edu/d337000/prep48h/{cycle_year}/prepbufr.gdas.{cycle_year}{cycle_month}{cycle_day}.t{cycle_hour}z.nr.48h"
        timeout_seconds: 300
      gpsro-gnssro:
        type: https-tar
        url: "https://data.gdex.ucar.edu/d735000/gpsro/{cycle_year}/gpsro.{cycle_year}{cycle_month}{cycle_day}.tar.gz"
        member: "gdas.gpsro.t{cycle_hour}z.{cycle_year}{cycle_month}{cycle_day}.bufr"
        timeout_seconds: 300
