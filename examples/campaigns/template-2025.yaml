# Template de campanha MONAN-JEDI em 2025
#
# Este arquivo mostra a interface temporal de uma campanha. Ele NAO fixa a
# configuracao cientifica: MONAN, observacoes e JEDI pertencem ao profile/cases
# referenciados abaixo e devem ser revisados antes do primeiro campaign run.
#
# Regra de uso:
#   1. valide primeiro P3D;
#   2. mantenha a mesma configuracao cientifica;
#   3. use um novo name/destination e altere somente duration para P7D, P30D
#      ou P365D.
#
campaign:
  name: monan-jedi-2025-3d
  start: 2025-01-01T00:00:00Z
  duration: P3D
  # Cadencia das analises. Pertence ao experimento, nao ao codigo do workflow.
  cycle_interval_hours: 6
  destination: cases/monan-jedi-2025-3d

# O profile seleciona os casos cientificos e os dados do site. O profile de
# producao 2025 deve apontar para configuracoes explicitamente validadas de:
#   - MONAN/MPAS;
#   - observacoes/Obs2IODA;
#   - MPAS-JEDI 3DVar/FGAT;
#   - inicializacao do primeiro ciclo.
#
# Nao reutilize automaticamente o profile historico de 2018 para 2025.
profile: profiles/jaci-mpas-3dfgat-x1.10242.yaml

# true executa tambem a previsao iniciada na ultima analise. Isso e util quando
# a campanha sera avaliada por previsoes alem do ultimo horario de assimilacao.
forecast:
  run_on_last_cycle: true

execution:
  swf_command: swf
